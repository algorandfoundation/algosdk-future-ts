name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

# Each package releases independently. The jobs run one at a time, because each
# pushes a release commit to main, and in dependency order, so a package is
# packed against the released versions of the packages it depends on.
jobs:
  composer:
    uses: ./.github/workflows/release-package.yml
    secrets: inherit
    with:
      package: composer
      tag-prefix: algosdk-composer-v

  app-client:
    needs: composer
    uses: ./.github/workflows/release-package.yml
    secrets: inherit
    with:
      package: app-client
      tag-prefix: algosdk-app-client-v

  localnet:
    needs: app-client
    uses: ./.github/workflows/release-package.yml
    secrets: inherit
    with:
      package: localnet
      tag-prefix: algosdk-localnet-v

  generator:
    needs: localnet
    uses: ./.github/workflows/release-package.yml
    secrets: inherit
    with:
      package: generator
      tag-prefix: algosdk-generator-v

  algosdk-future:
    needs: generator
    uses: ./.github/workflows/release-package.yml
    secrets: inherit
    with:
      package: algosdk-future
      # Matches the tags released before the split into packages
      tag-prefix: v
